<!--
  TEMPLATE EDITÁVEL DO TRANSCRIPT — CMS Valley
  Arquivo: src/tickets/templates/transcript_base.html

  Visual alinhado ao padrão PRO5M + identidade Centro Médico Sul Valley.
  O bot só preenche os placeholders e injeta as mensagens.

  Placeholders (não renomeie):
    {{TITULO_PAGINA}}  — título da aba do navegador
    {{NOME_GUILDA}}    — nome do servidor
    {{ICONE_GUILDA}}   — URL do ícone do servidor
    {{INFO_CANAL}}     — linha "Transcript · Categoria · #id"
    {{MENSAGENS}}      — blocos de mensagem gerados pelo bot
-->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>{{TITULO_PAGINA}}</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    :root {
      --bg-primary: #0b1020;
      --bg-secondary: #101626;
      --bg-tertiary: #182136;
      --bg-card: #131b2d;
      --bg-msg: #121a2b;
      --accent: #00f2ff;
      --accent-soft: rgba(0, 242, 255, 0.12);
      --accent-border: rgba(0, 242, 255, 0.28);
      --text-primary: #f5f8ff;
      --text-secondary: #c8d4f0;
      --text-muted: #7d8ab0;
      --border: rgba(120, 140, 180, 0.22);
      --success: #22c55e;
      --danger: #f87171;
      --warning: #fbbf24;
      --bot: #57d9e3;
      --staff: #fb923c;
      --autor: #4ade80;
      --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font: 14px/1.55 var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      background-image:
        radial-gradient(ellipse at 5% 0, rgba(0, 242, 255, 0.04), transparent 40%),
        radial-gradient(ellipse at 100% 100%, rgba(58, 166, 255, 0.04), transparent 40%);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    img { max-width: 100%; height: auto; }

    /* ---------- Layout ---------- */
    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    /* ---------- Header ---------- */
    .header {
      margin-bottom: 22px;
    }

    .header-box {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 32px rgba(8, 15, 32, 0.35);
    }

    .guild-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-border);
      box-shadow: 0 0 16px rgba(0, 242, 255, 0.22);
      flex-shrink: 0;
      background: #0b1120;
    }

    .guild-name {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .channel-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* ---------- Chat ---------- */
    .chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-container {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      background: var(--bg-msg);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: border-color 0.15s;
    }

    .message-container:hover {
      border-color: rgba(0, 242, 255, 0.18);
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid var(--accent-border);
      background: #0b1120;
    }

    .message-content {
      min-width: 0;
      flex: 1;
    }

    .message {
      min-width: 0;
    }

    .author-timestamp {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      margin-bottom: 6px;
    }

    .author {
      font-weight: 650;
      font-size: 13.5px;
      color: var(--text-primary);
      letter-spacing: -0.15px;
    }

    .timestamp {
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .bot-tag,
    .autor-tag,
    .staff-tag {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 5px;
      line-height: 1.3;
    }

    .bot-tag {
      background: rgba(87, 217, 227, 0.14);
      color: var(--bot);
      border: 1px solid rgba(87, 217, 227, 0.28);
    }

    .autor-tag {
      background: rgba(74, 222, 128, 0.12);
      color: var(--autor);
      border: 1px solid rgba(74, 222, 128, 0.28);
    }

    .staff-tag {
      background: rgba(251, 146, 60, 0.12);
      color: var(--staff);
      border: 1px solid rgba(251, 146, 60, 0.28);
    }

    .message.bot .author { color: var(--bot); }
    .message.staff .author { color: var(--staff); }
    .message.autor .author { color: var(--autor); }

    /* ---------- Conteúdo ---------- */
    .content-message,
    .container-text-block {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
      word-break: break-word;
      margin-top: 4px;
    }

    .content-message + .content-message {
      margin-top: 8px;
    }

    .small-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .container-divider {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 1.25rem 0;
    }

    /* Menções */
    .mention,
    .role,
    a.mention {
      background: rgba(0, 242, 255, 0.12);
      color: var(--accent);
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 500;
      text-decoration: none;
    }

    .spoiler {
      background: #1a2236;
      color: transparent;
      border-radius: 3px;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    .spoiler:hover,
    .spoiler:focus {
      color: var(--text-secondary);
      background: #243049;
    }

    pre.code-block {
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      margin: 8px 0;
      color: var(--text-secondary);
      display: block;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: rgba(0, 0, 0, 0.28);
      padding: 1px 5px;
      border-radius: 4px;
    }

    pre.code-block code {
      background: transparent;
      padding: 0;
    }

    /* ---------- Embeds ---------- */
    .embed {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      max-width: 520px;
    }

    .embed-author {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .embed-title {
      font-size: 14px;
      font-weight: 650;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .embed-description {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 6px;
    }

    .embed-field {
      margin-top: 8px;
    }

    .embed-field-name {
      font-size: 12px;
      font-weight: 650;
      color: var(--text-primary);
      margin-bottom: 2px;
    }

    .embed-field-value {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .embed-footer {
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .embed-image,
    .attachments img:not(.emoji):not(.button-emoji):not(.sticker) {
      max-width: min(440px, 100%);
      border-radius: 10px;
      margin-top: 8px;
      display: block;
      border: 1px solid var(--border);
    }

    .sticker {
      max-width: 150px;
      height: auto;
      display: block;
      margin-top: 6px;
    }

    .video-embed {
      max-width: min(480px, 100%);
      border-radius: 10px;
      margin-top: 8px;
      display: block;
      background: #000;
    }

    /* ---------- Attachments / files ---------- */
    .attachments {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12.5px;
      text-decoration: none;
      max-width: 100%;
      width: fit-content;
    }

    .file-link:hover {
      border-color: var(--accent-border);
      color: var(--accent);
      text-decoration: none;
    }

    /* ---------- Buttons (components) ---------- */
    .container-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .container-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      user-select: none;
      line-height: 1.3;
    }

    .container-button.disabled,
    .container-button.button-disabled,
    .button-disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button-primary,
    .container-button.button-primary {
      background: rgba(88, 101, 242, 0.22);
      border-color: rgba(88, 101, 242, 0.4);
      color: #c7cbff;
    }

    .button-secondary,
    .container-button.button-secondary {
      background: rgba(120, 140, 180, 0.12);
      border-color: var(--border);
      color: var(--text-secondary);
    }

    .button-success,
    .container-button.button-success {
      background: rgba(34, 197, 94, 0.14);
      border-color: rgba(34, 197, 94, 0.35);
      color: #86efac;
    }

    .button-danger,
    .container-button.button-danger {
      background: rgba(248, 113, 113, 0.14);
      border-color: rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }

    .button-emoji {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      display: inline-block;
    }

    .button-emoji img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    img.emoji,
    .content-message img.emoji {
      max-width: 22px;
      height: auto;
      vertical-align: middle;
    }

    /* ---------- Footer ---------- */
    .footer {
      margin-top: 28px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      padding: 12px 8px 0;
      border-top: 1px solid var(--border);
    }

    .footer-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      .page {
        padding: 16px 12px 36px;
      }

      .header-box {
        padding: 12px 14px;
      }

      .message-container {
        padding: 12px;
        gap: 10px;
      }

      .avatar {
        width: 34px;
        height: 34px;
      }

      .embed {
        max-width: 100%;
      }
    }

    @media print {
      #particles-js { display: none !important; }
      body {
        background: #fff;
        color: #111;
      }
      .message-container {
        break-inside: avoid;
        border-color: #ddd;
        background: #fafafa;
      }
    }
  </style>
</head>
<body>
  <div id="particles-js" aria-hidden="true"></div>
  <div class="page">
    <header class="header">
      <div class="header-box">
        <img class="guild-avatar" src="{{ICONE_GUILDA}}" alt="" />
        <div>
          <div class="guild-name">{{NOME_GUILDA}}</div>
          <div class="channel-info">{{INFO_CANAL}}</div>
        </div>
      </div>
    </header>

    <main class="chat">{{MENSAGENS}}</main>

    <footer class="footer">
      <div class="footer-box">
        <span>Centro Médico Sul Valley · Transcript</span>
        <span>Gerado automaticamente pelo sistema de tickets</span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    if (typeof particlesJS === "function") {
      particlesJS("particles-js", {
        particles: {
          number: { value: 45, density: { enable: true, value_area: 900 } },
          color: { value: "#00f2ff" },
          shape: { type: "circle" },
          opacity: { value: 0.3, random: true },
          size: { value: 2.1, random: true },
          line_linked: {
            enable: true,
            distance: 140,
            color: "#00f2ff",
            opacity: 0.14,
            width: 1
          },
          move: { enable: true, speed: 0.95, out_mode: "out" }
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: { enable: true, mode: "grab" },
            onclick: { enable: false },
            resize: true
          },
          modes: { grab: { distance: 110, line_linked: { opacity: 0.3 } } }
        },
        retina_detect: true
      });
    }
  </script>
</body>
</html>
