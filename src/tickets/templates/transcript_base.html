				padding: 10px 12px;
				overflow-x: auto;
				white-space: pre-wrap;
				font-family: ui-monospace, monospace;
				font-size: 0.82rem;
				margin: 8px 0;
				color: #dcddde;
			}
			.pdf-preview {
				border: 1px solid rgb(221, 221, 221);
				border-radius: 5px;
				padding: 10px;
				background-color: rgb(249, 249, 249);
				margin-bottom: 10px;
			}
			.pdf-embed {
				width: 100%;
				height: 400px;
				border-width: medium;
				border-style: none;
				border-color: currentcolor;
				border-image: none;
			}
			.perdeuSenha {
				color: rgb(170, 170, 170);
				opacity: 0.8;
				text-decoration: none;
				font-weight: 700;
				font-size: 10px;
				margin-top: 15px;
				display: block;
				transition: 0.2s;
			}
			.perdeuSenha:hover {
				opacity: 1;
				color: rgb(255, 255, 255);
			} /* ============
CLASSES - R ============ */
			.role {
				color: rgb(255, 255, 255);
				text-decoration: none;
				padding: 2px 5px;
				border-radius: 3px;
				transition: background-color 0.2s;
				box-shadow: rgba(0, 0, 0, 0.1) 0px 1px 2px;
			} /* ============ CLASSES - S
============ */
			.spoiler {
				background-color: rgb(47, 49, 54);
				color: transparent;
				cursor: pointer;
			}
			.spoiler:hover {
				color: white;
			}
			.staff-tag {
				background-color: rgb(255, 69, 0);
				color: rgb(255, 255, 255);
				padding: 2px 5px;
				border-radius: 3px;
				font-size: 0.8em;
				display: inline;
			}
			.sticker {
				max-width: 150px;
				height: auto;
				display: block;
			} /* ============ CLASSES - T ============
*/
			.timestamp {
				margin-right: 5px;
				margin-left: 5px;
				font-size: 0.8em;
				color: rgb(114, 118, 125);
			}
			.tnds {
				font-family: monospace;
				text-align: center;
				margin-top: 20px;
				font-size: 15px;
				color: rgb(8, 246, 255);
				text-shadow: rgb(115, 115, 115) 0px 0px 10px;
			}
			.tooltip {
				position: relative;
				display: inline-block;
			}
			.tooltip .tooltiptext {
				visibility: hidden;
				width: 200px;
				background-color: rgb(24, 25, 28);
				color: rgb(255, 255, 255);
				text-align: center;
				border-radius: 4px;
				padding: 8px;
				position: absolute;
				z-index: 1;
				bottom: 125%;
				left: 50%;
				margin-left: -100px;
				opacity: 0;
				transition: opacity 0.3s;
				font-size: 14px;
				border: 1px solid rgb(79, 84, 92);
			}
			.tooltip:hover .tooltiptext {
				visibility: visible;
				opacity: 1;
			} /* ============ CLASSES - V
============ */
			.video-embed {
				width: 100%;
				height: 400px;
				border-width: medium;
				border-style: none;
				border-color: currentcolor;
				border-image: none;
				margin-bottom: 10px;
			}
			.video-link {
				display: inline-block;
				margin: 10px 0px;
				padding: 10px;
				background-color: rgb(111, 228, 255);
				border-radius: 5px;
				text-decoration: none;
				color: rgb(51, 51, 51);
				font-weight: bold;
			}
			.video-link:hover {
				background-color: rgb(224, 224, 224);
			} /* ============
MEDIA QUERIES ============ */
			@media (max-width: 768px) {
				.logoContainer {
					display: none;
				}
				#inviteContainer {
					width: auto;
					height: auto;
				}
				#faq {
					width: 90%;
				}
				.desbloquear {
					width: 80%;
				}
				.formContainer input[type="password"],
				.formContainer input[type="text"] {
					width: 90%;
				}
				.logoContainer img {
					max-width: 90px;
				}
			}
			@media only screen and (max-width: 700px) {
				.bot-tag,
				.bot-icon,
				.autor-tag,
				.autor-icon,
				.staff-tag,
				.staff-icon,
				.author-timestamp,
				.timestamp,
				.message-self,
				.message-staff,
				.message-bot {
					font-size: 0.7em !important;
					padding: 1px 3px !important;
				}
				.modal-content {
					width: 100%;
				}
				.message-container {
					flex-direction: column;
					align-items: flex-start;
				}
				.avatar {
					margin-bottom: 10px;
				}
				.message,
				.embed-container {
					max-width: 100%;
				}
			}

			.msg-link {
				color: rgb(0, 175, 244);
				text-decoration: underline;
				word-break: break-all;
			}
			.attachments img,
			.content-message img.emoji,
			img.emoji {
				max-width: 48px;
				height: auto;
				vertical-align: middle;
			}
			.attachments img:not(.emoji) {
				max-width: min(440px, 100%);
				border-radius: 10px;
			}
			pre.code-block {
				background: #1e1f22;
				border: 1px solid #4f545c;
				border-radius: 8px;
				padding: 10px 12px;
				overflow-x: auto;
				white-space: pre-wrap;
				font-family: ui-monospace, monospace;
				font-size: 0.82rem;
				margin: 8px 0;
				color: #dcddde;
				display: block;
			}
		</style>
	</head>
	<body>
		<div id="particles-js"></div>
		<div class="page">
			<header class="header">
				<div class="header-box">
					<img
						class="guild-avatar"
						src="{{ICONE_GUILDA}}"
						alt=""
					/>
					<div class="guild-name">
						{{NOME_GUILDA}}
					</div>
					<div class="channel-info">
						{{INFO_CANAL}}
					</div>
				</div>
			</header>
			<main class="chat">{{MENSAGENS}}</main>
			<footer class="footer">
				CMS Valley · Transcript gerado automaticamente
			</footer>
		</div>
		<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
		<script>
			particlesJS("particles-js", {
				particles: {
					number: {
						value: 55,
						density: {
							enable: true,
							value_area: 900,
						},
					},
					color: { value: "#00aff4" },
					shape: { type: "circle" },
					opacity: { value: 0.4, random: true },
					size: { value: 2.5, random: true },
					line_linked: {
						enable: true,
						distance: 140,
						color: "#00aff4",
						opacity: 0.2,
						width: 1,
					},
					move: {
						enable: true,
						speed: 1.1,
						out_mode: "out",
					},
				},
				interactivity: {
					detect_on: "canvas",
					events: {
						onhover: {
							enable: true,
							mode: "grab",
						},
						onclick: { enable: false },
						resize: true,
					},
					modes: {
						grab: {
							distance: 120,
							line_linked: {
								opacity: 0.35,
							},
						},
					},
				},
				retina_detect: true,
			});
		</script>
	</body>
</html>
